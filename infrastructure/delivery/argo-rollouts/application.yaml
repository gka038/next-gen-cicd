apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.6
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/infrastructure/delivery/argo-rollouts/values.yaml
    - repoURL: https://github.com/gka038/next-gen-cicd
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gka038/next-gen-cicd
      targetRevision: main
      path: infrastructure/delivery/argo-rollouts/extra
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
