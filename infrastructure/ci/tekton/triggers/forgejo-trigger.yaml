# Receives Forgejo's (Gitea-compatible) push webhook and starts build-scan-sign.
# Point a repo's Forgejo webhook at this EventListener's Service
# (el-forgejo-listener.tekton-pipelines.svc.cluster.local:8080) with content
# type application/json and the shared secret named below.
#
# Forgejo Actions is the primary CI trigger path for this stack (workflows
# live in each product repo's .forgejo/workflows/); this EventListener is the
# alternative/complementary path for repos that call into Tekton directly
# instead of running a Forgejo Actions job themselves.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: forgejo-push-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: revision
      value: $(body.after)
    - name: repo-name
      value: $(body.repository.name)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: forgejo-push-template
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
    - name: revision
    - name: repo-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: build-scan-sign-
      spec:
        pipelineRef:
          name: build-scan-sign
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: image
            value: harbor.local/$(tt.params.repo-name)/$(tt.params.repo-name):$(tt.params.revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
          - name: sbom
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 100Mi
          - name: dockerconfig
            secret:
              secretName: harbor-push-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: forgejo-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: forgejo-push
      bindings:
        - ref: forgejo-push-binding
      template:
        ref: forgejo-push-template
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-sa-role
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelineresources", "taskruns"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-sa-binding
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-sa-role
  apiGroup: rbac.authorization.k8s.io
