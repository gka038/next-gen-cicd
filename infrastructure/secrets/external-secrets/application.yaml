apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.14.1
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/infrastructure/secrets/external-secrets/values.yaml
    - repoURL: https://github.com/gka038/next-gen-cicd
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gka038/next-gen-cicd
      targetRevision: main
      path: infrastructure/secrets/external-secrets/extra
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
