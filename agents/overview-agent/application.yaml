apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overview-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gka038/next-gen-cicd
    targetRevision: fm/ngc-1
    path: agents/overview-agent
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: agents-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
