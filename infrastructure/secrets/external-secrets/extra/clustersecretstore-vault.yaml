# Wires External Secrets Operator to this stack's own Vault using Kubernetes
# auth: ESO's ServiceAccount token authenticates to Vault, which must have the
# "kubernetes" auth method and a "external-secrets" role enabled first — see
# the root README for the one-time `vault auth enable/write` commands (Vault
# starts sealed and empty; there's nothing to point at until that's done).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
