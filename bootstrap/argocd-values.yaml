# Single-node sizing for the one-time, imperative Argo CD install (argo-cd/argo-cd).
# Argo CD can't GitOps-install itself, so this chart is applied directly with
# `helm install` (see bootstrap/README.md) rather than through an Application.
# Controller/server/repo-server/applicationset-controller already default to a
# single replica each in the upstream chart; this file only trims resources
# and turns off the two components this bootstrap doesn't need.

# No external IdP in scope for this stack — drop Dex to save a pod.
dex:
  enabled: false

# Sync/health notifications aren't wired to anything yet; skip the extra pod.
# Re-enable later if you want Slack/webhook notifications on sync status.
notifications:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  # No cloud LoadBalancer on a single-node cluster: expose via ingress-nginx or
  # port-forward. See the root README for both options.
  service:
    type: ClusterIP
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - argocd.local

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

configs:
  params:
    # Applications wired up by this repo use Helm multi-source `$values` refs
    # and plain directory sources; nothing here needs server-side TLS to Git.
    server.insecure: false
