# Single-node sizing for External Secrets Operator (external-secrets/external-secrets).
# Controller, webhook and cert-controller already default to 1 replica each.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

serviceMonitor:
  enabled: true
