apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.2.0
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/infrastructure/scm/forgejo/values.yaml
    - repoURL: https://github.com/gka038/next-gen-cicd
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
