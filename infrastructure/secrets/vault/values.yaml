# Single-node sizing for Vault (hashicorp/vault).
#
# Standalone mode (the chart default) with file-backed storage: one pod, one
# PVC, no Consul/HA backend. This still starts SEALED on every restart and
# needs a human to run `vault operator init` + `vault operator unseal` once —
# see the root README for the exact commands. For a lighter-weight path with
# no unseal ceremony at all, skip Vault and point External Secrets Operator
# at SOPS-encrypted files instead (also documented in the README).
#
# The Agent Injector isn't needed: External Secrets Operator talks to Vault's
# API directly, so it's disabled here to save a pod.
injector:
  enabled: false

server:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  dataStorage:
    enabled: true
    size: 5Gi
    # storageClass left unset so the cluster's default StorageClass is used.

  standalone:
    enabled: true

  ha:
    enabled: false

  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - host: vault.local
        paths: []

ui:
  enabled: true
